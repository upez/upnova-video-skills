<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Regular.otf"); font-weight: 400; font-style: normal; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Medium.otf"); font-weight: 500; font-style: normal; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Bold.otf"); font-weight: 700; font-style: normal; }
        [data-composition-id="screenshot-highlight"] { position: absolute; inset: 0; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; letter-spacing: -1px; }
        [data-composition-id="screenshot-highlight"] .screen { position: absolute; inset: 0; overflow: hidden; background: #000; }
        [data-composition-id="screenshot-highlight"] .slats { position: absolute; left: -160px; width: 1400px; bottom: 0; height: 800px; background: url("assets/backgrounds/dark-slats.jpg") 50% 100% / cover no-repeat; opacity: 0.7; }

        /* the screenshot sits in a clipped stage under the guide card */
        [data-composition-id="screenshot-highlight"] .stage { position: absolute; left: 0; right: 0; top: 540px; bottom: 0; overflow: hidden; perspective: 1600px; perspective-origin: 50% 50%; }
        [data-composition-id="screenshot-highlight"] .phone { position: absolute; left: 240px; top: 20px; width: 600px; height: 1306px; border-radius: 40px; overflow: hidden; background: #fff url("assets/guides/builder-page.png") 0 0 / 600px 1306px no-repeat; box-shadow: 0 0 0 8px #1b1d1b, 0 40px 120px rgba(0, 0, 0, 0.6); transform-origin: 298px 1093px; }
        /* lens blur: two blurred copies of the screenshot, masked so the slots stay sharp and the blur grows with distance from them */
        [data-composition-id="screenshot-highlight"] .lens { position: absolute; inset: 0; background: #fff url("assets/guides/builder-page.png") 0 0 / 600px 1306px no-repeat; opacity: 0; }
        [data-composition-id="screenshot-highlight"] .lens.near { filter: blur(5px); -webkit-mask-image: radial-gradient(ellipse 250px 120px at 298px 1093px, transparent 60%, #000 100%); mask-image: radial-gradient(ellipse 250px 120px at 298px 1093px, transparent 60%, #000 100%); }
        [data-composition-id="screenshot-highlight"] .lens.far { filter: blur(16px); -webkit-mask-image: radial-gradient(ellipse 560px 420px at 298px 1093px, transparent 45%, #000 100%); mask-image: radial-gradient(ellipse 560px 420px at 298px 1093px, transparent 45%, #000 100%); }
        [data-composition-id="screenshot-highlight"] .phone svg { position: absolute; left: 0; top: 0; width: 600px; height: 1306px; overflow: visible; }

        /* the annotation layer: hand-drawn ring, arrow and label */
        [data-composition-id="screenshot-highlight"] svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
        [data-composition-id="screenshot-highlight"] .tag { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 636px; height: 96px; padding: 0 36px; border-radius: 48px; background: #c5eea8; color: #0b0d0a; font-size: 54px; line-height: 96px; font-weight: 700; letter-spacing: -0.04em; white-space: nowrap; }

        /* step guide card, same as the caption guide */
        [data-composition-id="screenshot-highlight"] .guide { position: absolute; left: 60px; right: 60px; top: 290px; height: 230px; border-radius: 36px; background: rgba(8, 10, 8, 0.86); border: 2px solid rgba(255, 255, 255, 0.12); }
        [data-composition-id="screenshot-highlight"] .steps { position: absolute; left: 30px; right: 30px; top: 24px; height: 60px; display: flex; gap: 14px; }
        [data-composition-id="screenshot-highlight"] .step { position: relative; flex: 1; height: 60px; display: flex; align-items: center; gap: 12px; padding-left: 6px; font-size: 32px; font-weight: 500; letter-spacing: -0.5px; white-space: nowrap; color: rgba(255, 255, 255, 0.45); }
        [data-composition-id="screenshot-highlight"] .step b { display: block; width: 44px; height: 44px; border-radius: 22px; background: rgba(255, 255, 255, 0.12); color: rgba(255, 255, 255, 0.7); text-align: center; font-size: 26px; line-height: 44px; font-weight: 700; flex-shrink: 0; letter-spacing: 0; }
        [data-composition-id="screenshot-highlight"] .segs { position: absolute; left: 30px; right: 30px; top: 100px; height: 8px; display: flex; gap: 14px; }
        [data-composition-id="screenshot-highlight"] .seg { position: relative; flex: 1; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
        [data-composition-id="screenshot-highlight"] .seg i { position: absolute; inset: 0; background: #c5eea8; transform-origin: 0% 50%; }
        [data-composition-id="screenshot-highlight"] .note { position: absolute; left: 34px; right: 34px; top: 128px; height: 90px; font-size: 38px; line-height: 46px; font-weight: 400; letter-spacing: -0.5px; color: rgba(255, 255, 255, 0.92); opacity: 0; }
        [data-composition-id="screenshot-highlight"] .note em { font-style: normal; color: #c5eea8; font-weight: 500; }
      </style>
      <div data-hf-id="hf-sh01" id="screenshot-highlight-root" data-composition-id="screenshot-highlight" data-width="1080" data-height="1920">
        <div data-hf-id="hf-sh02" class="screen" id="screenshot-highlight-screen">
          <div data-hf-id="hf-sh03" class="slats" data-layout-allow-overflow="" id="screenshot-highlight-slats"></div>
          <div data-hf-id="hf-sh04" class="stage">
            <div data-hf-id="hf-sh05" class="phone" id="screenshot-highlight-phone" data-layout-allow-overflow="">
              <div data-hf-id="hf-sh30" class="lens near" id="screenshot-highlight-near"></div>
              <div data-hf-id="hf-sh31" class="lens far" id="screenshot-highlight-far"></div>
              <svg data-hf-id="hf-sh32" viewBox="0 0 600 1306"><path data-hf-id="hf-sh08" id="screenshot-highlight-ring" d="M 140 1100 C 136 1062, 210 1046, 300 1046 C 400 1046, 462 1062, 458 1094 C 454 1128, 380 1142, 296 1140 C 210 1138, 140 1126, 146 1088 C 148 1074, 160 1064, 176 1058" fill="none" stroke="#c5eea8" stroke-width="8" stroke-linecap="round" /></svg>
            </div>
          </div>
          <svg data-hf-id="hf-sh07" viewBox="0 0 1080 1920">
            <path data-hf-id="hf-sh09" id="screenshot-highlight-arrow" d="M 540 740 C 558 776, 558 806, 543 842" fill="none" stroke="#c5eea8" stroke-width="9" stroke-linecap="round" />
            <path data-hf-id="hf-sh10" id="screenshot-highlight-head" d="M 519 818 L 543 846 L 567 818" fill="none" stroke="#c5eea8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div data-hf-id="hf-sh11" class="tag" id="screenshot-highlight-tag">Bundle slots</div>
          <div data-hf-id="hf-sh12" class="guide" id="screenshot-highlight-guide">
            <div data-hf-id="hf-sh13" class="steps">
              <div data-hf-id="hf-sh14" class="step" id="screenshot-highlight-st0"><b data-hf-id="hf-sh15">1</b>Show it</div>
              <div data-hf-id="hf-sh16" class="step" id="screenshot-highlight-st1"><b data-hf-id="hf-sh17">2</b>Focus</div>
              <div data-hf-id="hf-sh18" class="step" id="screenshot-highlight-st2"><b data-hf-id="hf-sh19">3</b>Point + name</div>
            </div>
            <div data-hf-id="hf-sh20" class="segs">
              <div data-hf-id="hf-sh21" class="seg"><i data-hf-id="hf-sh22" id="screenshot-highlight-g0"></i></div>
              <div data-hf-id="hf-sh23" class="seg"><i data-hf-id="hf-sh24" id="screenshot-highlight-g1"></i></div>
              <div data-hf-id="hf-sh25" class="seg"><i data-hf-id="hf-sh26" id="screenshot-highlight-g2"></i></div>
            </div>
            <div data-hf-id="hf-sh27" class="note" id="screenshot-highlight-n0" data-layout-allow-overlap="">Show the <em data-hf-id="hf-h076">whole screen</em> first, so people know where they are.</div>
            <div data-hf-id="hf-sh28" class="note" id="screenshot-highlight-n1" data-layout-allow-overlap="">Push the camera in, turn it, and let <em>lens blur</em> soften the rest.</div>
            <div data-hf-id="hf-sh29" class="note" id="screenshot-highlight-n2" data-layout-allow-overlap=""><em data-hf-id="hf-d9u0">Circle it</em>, draw an arrow, and name it in plain words.</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          // Emil Kowalski easing (emil-design-eng): strong ease-out for entrances, strong ease-in-out for moves. No bounce.
          (function () {
            if (window.__emilEases) return; window.__emilEases = true;
            if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("emilOut", "0.23,1,0.32,1"); CustomEase.create("emilInOut", "0.77,0,0.175,1"); }
            else { gsap.registerEase("emilOut", gsap.parseEase("expo.out")); gsap.registerEase("emilInOut", gsap.parseEase("expo.inOut")); }
          })();
          // HIGHLIGHT A FEATURE IN A SCREENSHOT. 3 steps: show the whole screen flat (2D), then a 3D camera move
          // (closer, tilted back, turned) with long-lens depth of field so only the feature stays sharp, then a ring
          // drawn on the screen, a label and an arrow. To reuse: swap the screenshot (sized 600px wide), set the
          // phone's transform-origin to the feature's centre, move the .lens mask bands so the clear band sits on the
          // feature, move the ring path (phone pixels), then place the label and arrow from a snapshot.
          var D = 9;
          var STEPS = [0, 2.4, 4.8];
          var CAM = { z: 820, y: -560, tilt: 12, turn: -24 }; // camera: closer, lifted, tilted back, turned
          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById("screenshot-highlight-" + id); };
          function draw(path, at, dur) {
            var len = path.getTotalLength();
            // hidden until it starts drawing, or the round line cap shows as a dot
            tl.fromTo(path, { opacity: 0 }, { opacity: 1, duration: 0.01 }, at);
            tl.fromTo(path, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "emilInOut" }, at);
          }
          tl.fromTo($("screen"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "emilOut" }, 0);
          tl.fromTo($("slats"), { x: -40 }, { x: 40, duration: D, ease: "none" }, 0);
          tl.fromTo($("guide"), { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.6, ease: "emilOut" }, 0.05);

          // tracker
          STEPS.forEach(function (at, i) {
            var end = i < 2 ? STEPS[i + 1] : D;
            tl.fromTo($("st" + i), { color: "rgba(255,255,255,0.45)" }, { color: "#ffffff", duration: 0.25, ease: "emilOut" }, at + 0.05);
            tl.fromTo($("st" + i).querySelector("b"), { backgroundColor: "rgba(255,255,255,0.12)", color: "rgba(255,255,255,0.7)" }, { backgroundColor: "#c5eea8", color: "#0b0d0a", duration: 0.25, ease: "emilOut" }, at + 0.05);
            tl.fromTo($("g" + i), { scaleX: 0 }, { scaleX: 1, duration: end - at, ease: "none" }, at);
            tl.fromTo($("n" + i), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "emilOut" }, at + 0.1);
            if (i < 2) {
              tl.to($("n" + i), { opacity: 0, y: -10, duration: 0.2, ease: "emilOut" }, end - 0.2);
              tl.to($("st" + i), { color: "rgba(255,255,255,0.6)", duration: 0.25, ease: "emilOut" }, end);
            }
          });

          // 1 show it: plain 2D, the whole screenshot rises in flat and sharp
          tl.fromTo($("phone"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: "emilOut" }, 0.15);

          // 2 focus: a 3D camera move. The camera closes in on the slots (z), the screen tilts back (rotationX) and
          // turns a little (rotationY), and a long-lens depth of field kicks in: the slots stay sharp, everything
          // gets softer the further it is from them.
          tl.to($("phone"), { z: CAM.z, y: CAM.y, rotationX: CAM.tilt, rotationY: CAM.turn, duration: 1.8, ease: "emilInOut" }, STEPS[1] + 0.1);
          tl.fromTo([$("near"), $("far")], { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "emilInOut" }, STEPS[1] + 0.4);

          // 3 point + name: the ring draws round the slots (on the tilted screen), the label sits above and the arrow draws down to the ring
          draw($("ring"), STEPS[2] + 0.1, 0.8);
          tl.fromTo($("tag"), { opacity: 0, y: 20, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "emilOut" }, STEPS[2] + 0.6);
          draw($("arrow"), STEPS[2] + 0.8, 0.45);
          draw($("head"), STEPS[2] + 1.2, 0.25);

          tl.to($("screen"), { opacity: 0, duration: 0.35, ease: "emilOut" }, D - 0.35);
          window.__timelines["screenshot-highlight"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
