    <template>
      <style>

        [data-composition-id="ab-test"] { position: absolute; inset: 0; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }

        [data-composition-id="ab-test"] .slats { position: absolute; left: -160px; width: 1400px; bottom: 0; height: 760px; background: url("assets/backgrounds/dark-slats.jpg") 50% 100% / cover no-repeat; opacity: 0.6; }
        [data-composition-id="ab-test"] .tag { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; height: 84px; padding: 0 34px 0 28px; border-radius: 42px; border: 2px solid rgba(255, 255, 255, 0.32); display: flex; align-items: center; gap: 18px; font-size: 56px; font-weight: 600; letter-spacing: -0.02em; text-transform: uppercase; white-space: nowrap; }
        [data-composition-id="ab-test"] .tag i { display: block; width: 18px; height: 18px; border-radius: 9px; background: #c5eea8; flex-shrink: 0; }
        [data-composition-id="ab-test"] .gl { font-family: "Apple Garamond", serif; font-weight: 700; letter-spacing: -0.06em; padding-right: 0.06em; background-image: linear-gradient(105deg, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0.9) 50%, rgba(255, 255, 255, 0) 62%), linear-gradient(180deg, #effbe6 0%, #b3e891 34%, #74c84b 50%, #8fd86a 72%, #dcf7c9 100%); background-size: 260% 100%, 100% 100%; background-position: 130% 0, 0 0; background-repeat: no-repeat; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35)) drop-shadow(0 8px 20px rgba(0, 0, 0, 0.35)); }
        [data-composition-id="ab-test"] .col { position: absolute; top: 700px; width: 400px; height: 690px; border-radius: 40px; background: rgba(255, 255, 255, 0.07); border: 2px solid rgba(255, 255, 255, 0.14); }
        [data-composition-id="ab-test"] .col .lab { position: absolute; left: 0; right: 0; top: 70px; height: 70px; text-align: center; font-size: 60px; line-height: 70px; font-weight: 700; letter-spacing: -0.03em; }
        [data-composition-id="ab-test"] .col .track { position: absolute; left: 120px; right: 120px; top: 170px; bottom: 50px; border-radius: 24px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
        [data-composition-id="ab-test"] .col .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; border-radius: 24px; transform-origin: 50% 100%; }
        [data-composition-id="ab-test"] .win { position: absolute; left: 580px; width: 360px; top: 655px; height: 90px; border-radius: 45px; background: #0b0d0a; border: 2px solid #c5eea8; color: #c5eea8; text-align: center; font-size: 56px; line-height: 86px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
      </style>
      <div data-hf-id="hf-9pu8" id="ab-test-root" data-composition-id="ab-test" data-width="1080" data-height="1920">
        <div data-hf-id="hf-z5cl" class="screen" id="ab-test-screen">
          <div data-hf-id="hf-tdiy" class="slats" id="ab-test-slats" data-layout-allow-overflow=""></div>
          <div data-hf-id="hf-aya0" class="tag" id="ab-test-tag" style="top: 490px"><i data-hf-id="hf-wt6k"></i>A/B test</div>
          <div data-hf-id="hf-674w" class="col" id="ab-test-a" style="left: 120px"><div data-hf-id="hf-i4ai" class="lab">Offer A</div><div data-hf-id="hf-64lp" class="track"><div data-hf-id="hf-q9w7" class="bar" id="ab-test-ba" style="background: #b4b8b1"></div></div></div>
          <div data-hf-id="hf-9arj" class="col" id="ab-test-b" style="left: 560px"><div data-hf-id="hf-iilj" class="lab">Offer B</div><div data-hf-id="hf-gav5" class="track"><div data-hf-id="hf-ow5k" class="bar" id="ab-test-bb" style="background: linear-gradient(180deg, #dcf7c9 0%, #8fd86a 60%, #74c84b 100%)"></div></div></div>
          <div data-hf-id="hf-nnr0" class="win" id="ab-test-win">Winner</div>
        </div>
      </div>
      <script>
        (function () {
          // Emil Kowalski easing (emil-design-eng): strong ease-out for entrances, strong ease-in-out for moves. No bounce.
          (function () {
            if (window.__emilEases) return; window.__emilEases = true;
            if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("emilOut", "0.23,1,0.32,1"); CustomEase.create("emilInOut", "0.77,0,0.175,1"); }
            else { gsap.registerEase("emilOut", gsap.parseEase("expo.out")); gsap.registerEase("emilInOut", gsap.parseEase("expo.inOut")); }
          })();
          // A/B TEST. "We watch the numbers, run A/B tests, and keep improving every offer": two offers race, B wins.
          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById("ab-test-" + id); };
          function rise(el, at, d) { tl.fromTo(el, { opacity: 0, y: 30, scale: 0.95, filter: "blur(10px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: d || 0.6, ease: "emilOut" }, at); }
          function lift(el, at, d) { tl.fromTo(el, { opacity: 0, y: 24, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: d || 0.6, ease: "emilOut" }, at); }
          function sheen(el, at) { tl.fromTo(el, { backgroundPosition: "130% 0, 0 0" }, { backgroundPosition: "-30% 0, 0 0", duration: 0.9, ease: "emilInOut" }, at); }
          function draw(path, at, dur) { var len = path.getTotalLength(); tl.fromTo(path, { opacity: 0 }, { opacity: 1, duration: 0.01 }, at); tl.fromTo(path, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "emilInOut" }, at); }
          tl.fromTo($("screen"), { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0);
          tl.fromTo($("slats"), { x: -40 }, { x: 40, duration: 3.44, ease: "none" }, 0);
          rise($("tag"), 0.02, 0.5);
          rise($("a"), 0.1, 0.6);
          rise($("b"), 0.2, 0.6);
          // "run A/B tests": both offers fill, B pulls ahead
          tl.fromTo($("ba"), { scaleY: 0 }, { scaleY: 0.5, duration: 1.2, ease: "emilInOut" }, 0.6);
          tl.fromTo($("bb"), { scaleY: 0 }, { scaleY: 0.86, duration: 1.4, ease: "emilInOut" }, 0.6);
          // "keep improving every offer": B is the winner, A steps back
          tl.to($("a"), { opacity: 0.45, duration: 0.4, ease: "emilOut" }, 2.1);
          tl.fromTo($("win"), { opacity: 0, y: 20, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "emilOut" }, 2.1);
          window.__timelines["ab-test"] = tl;
        })();
      </script>
