        [data-composition-id="testimonial-stantt"] .who i { display: block; width: 14px; height: 14px; border-radius: 7px; background: #c5eea8; flex-shrink: 0; }
        [data-composition-id="testimonial-stantt"] .cap { position: absolute; left: 40px; right: 40px; top: 780px; height: 100px; text-align: center; font-size: 80px; line-height: 100px; font-weight: 700; letter-spacing: -0.08em; white-space: nowrap; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), 0 8px 28px rgba(0, 0, 0, 0.45); opacity: 0; }
        [data-composition-id="testimonial-stantt"] .cap b { font-family: "Apple Garamond", serif; font-weight: 700; display: inline-block; vertical-align: baseline; font-size: 1.2em; letter-spacing: -0.06em; background-image: linear-gradient(105deg, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0.9) 50%, rgba(255, 255, 255, 0) 62%), linear-gradient(180deg, #effbe6 0%, #b3e891 34%, #74c84b 50%, #8fd86a 72%, #dcf7c9 100%); background-size: 260% 100%, 100% 100%; background-position: 130% 0, 0 0; background-repeat: no-repeat; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; text-shadow: none; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35)) drop-shadow(0 8px 20px rgba(0, 0, 0, 0.35)); }
        [data-composition-id="testimonial-stantt"] .stat { position: absolute; left: 100px; right: 60px; height: 190px; display: flex; align-items: baseline; gap: 26px; white-space: nowrap; }
        [data-composition-id="testimonial-stantt"] .num { display: block; font-size: 200px; line-height: 190px; letter-spacing: -0.06em; padding-right: 0.06em; font-family: "Apple Garamond", serif; font-weight: 700; background-image: linear-gradient(105deg, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0.9) 50%, rgba(255, 255, 255, 0) 62%), linear-gradient(180deg, #effbe6 0%, #b3e891 34%, #74c84b 50%, #8fd86a 72%, #dcf7c9 100%); background-size: 260% 100%, 100% 100%; background-position: 130% 0, 0 0; background-repeat: no-repeat; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35)) drop-shadow(0 8px 20px rgba(0, 0, 0, 0.35)); }
        [data-composition-id="testimonial-stantt"] .lab { display: block; font-size: 52px; font-weight: 500; letter-spacing: -0.03em; }
        [data-composition-id="testimonial-stantt"] .brand { display: block; width: 148px; height: 22px; background: url("assets/brand/stantt-wordmark.png") 0 50% / contain no-repeat; filter: brightness(0) invert(1); flex-shrink: 0; }
      </style>
      <div data-hf-id="hf-ts01" id="testimonial-stantt-root" data-composition-id="testimonial-stantt" data-width="1080" data-height="1920">
        <div data-hf-id="hf-ts02" class="screen" id="testimonial-stantt-screen">
          <div data-hf-id="hf-ts03" class="slats" data-layout-allow-overflow id="testimonial-stantt-slats"></div>
          <div data-hf-id="hf-ts07" class="who" id="testimonial-stantt-who"><i data-hf-id="hf-ts08"></i>Matt · CEO,<span data-hf-id="hf-ts21" class="brand" role="img" aria-label="Stantt"></span></div>
          <div data-hf-id="hf-ts04" class="card" id="testimonial-stantt-card">
            <video data-hf-id="hf-ts05" id="testimonial-stantt-video" class="clip" src="assets/testimonials/stantt-matt-short.mp4" data-start="0" data-duration="6.35" data-media-start="0.1" data-track-index="6" data-has-audio="true" playsinline></video>
            <div data-hf-id="hf-ts06" class="fade"></div>
            <div data-hf-id="hf-ts09" class="cap" id="testimonial-stantt-g0" data-layout-allow-overlap>In our last test alone,</div>
            <div data-hf-id="hf-ts10" class="cap" id="testimonial-stantt-g1" data-layout-allow-overlap>we increased</div>
            <div data-hf-id="hf-ts11" class="cap" id="testimonial-stantt-g2" data-layout-allow-overlap>conversion rate <b class="hi" data-hf-id="hf-ts12">34%</b></div>
            <div data-hf-id="hf-ts13" class="cap" id="testimonial-stantt-g3" data-layout-allow-overlap>and RPV <b class="hi" data-hf-id="hf-ts14">30%</b>.</div>
          </div>
          <div data-hf-id="hf-ts19" class="stat" style="top: 1360px"><span data-hf-id="hf-ts15" class="num" id="testimonial-stantt-n0">+0%</span><span data-hf-id="hf-ts16" class="lab" id="testimonial-stantt-l0">conversion rate</span></div>
          <div data-hf-id="hf-ts20" class="stat" style="top: 1560px"><span data-hf-id="hf-ts17" class="num" id="testimonial-stantt-n1">+0%</span><span data-hf-id="hf-ts18" class="lab" id="testimonial-stantt-l1">revenue per visitor</span></div>
        </div>
      </div>
      <script>
        (function () {
          // Emil Kowalski easing (emil-design-eng): strong ease-out for entrances, strong ease-in-out for moves. No bounce.
          (function () {
            if (window.__emilEases) return; window.__emilEases = true;
            if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("emilOut", "0.23,1,0.32,1"); CustomEase.create("emilInOut", "0.77,0,0.175,1"); }
            else { gsap.registerEase("emilOut", gsap.parseEase("expo.out")); gsap.registerEase("emilInOut", gsap.parseEase("expo.inOut")); }
          })();
          // VIDEO TESTIMONIAL. A brand founder says the result on camera; captions follow his words and the two numbers
          // count up on the words that name them. Source: Stantt testimonial (upnova-website case study), 22.0s to 28.35s.
          // To reuse: swap the video and data-media-start, the name pill, GROUPS (seconds in this section) and STATS.
          var D = 6.6;
          var GROUPS = [[0.07, 2.0], [2.0, 2.98], [2.98, 4.5], [4.5, 6.35]];
          var STATS = [{ id: "0", value: 34, at: 3.52 }, { id: "1", value: 30, at: 5.36 }];
          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById("testimonial-stantt-" + id); };
          tl.fromTo($("screen"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "emilOut" }, 0);
          tl.fromTo($("slats"), { x: -40 }, { x: 40, duration: D, ease: "none" }, 0);
          tl.fromTo($("card"), { opacity: 0, y: 80, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "emilOut" }, 0);
          tl.fromTo($("who"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "emilOut" }, 0.35);

          // captions: each phrase appears at once on its first word and leaves when the next one starts
          // emphasis words: a light sheen sweeps across the glass once when the phrase appears
          function sheen(el, at) {
            el.querySelectorAll(".hi").forEach(function (h) {
              tl.fromTo(h, { backgroundPosition: "130% 0, 0 0" }, { backgroundPosition: "-30% 0, 0 0", duration: 0.9, ease: "emilInOut" }, at + 0.05);
            });
          }
          GROUPS.forEach(function (g, i) {
            tl.set($("g" + i), { opacity: 1 }, g[0]);
            sheen($("g" + i), g[0]);
            tl.set($("g" + i), { opacity: 0 }, g[1]);
          });

          // the numbers rise and count on the spoken words
          STATS.forEach(function (s) {
            tl.fromTo([$("n" + s.id), $("l" + s.id)], { opacity: 0, y: 30, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "emilOut" }, s.at - 0.1);
            var c = { v: 0 };
            tl.fromTo(c, { v: 0 }, { v: s.value, duration: 0.8, ease: "emilOut",
              onUpdate: function () { $("n" + s.id).textContent = "+" + Math.round(c.v) + "%"; } }, s.at - 0.1);
            tl.fromTo($("n" + s.id), { backgroundPosition: "130% 0, 0 0" }, { backgroundPosition: "-30% 0, 0 0", duration: 1.1, ease: "emilInOut" }, s.at + 0.3);
          });

          tl.to($("screen"), { opacity: 0, duration: 0.35, ease: "emilOut" }, D - 0.4);
          window.__timelines["testimonial-stantt"] = tl;
        })();
      </script>
    </template>
  </body>
