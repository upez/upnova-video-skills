<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Regular.otf"); font-weight: 400; font-style: normal; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Medium.otf"); font-weight: 500; font-style: normal; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Bold.otf"); font-weight: 700; font-style: normal; }
        [data-composition-id="crossed-out"] { position: absolute; inset: 0; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
        [data-composition-id="crossed-out"] .screen { position: absolute; inset: 0; overflow: hidden; background: #000; }
        [data-composition-id="crossed-out"] .slats { position: absolute; left: -160px; width: 1400px; bottom: 0; height: 760px; background: url("assets/backgrounds/dark-slats.jpg") 50% 100% / cover no-repeat; opacity: 0.8; }
        [data-composition-id="crossed-out"] .tag { position: absolute; left: 108px; top: 470px; height: 64px; padding: 0 28px 0 22px; border-radius: 32px; border: 2px solid rgba(255, 255, 255, 0.35); display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
        [data-composition-id="crossed-out"] .tag i { display: block; width: 14px; height: 14px; border-radius: 7px; background: #ef4444; box-shadow: 0 0 14px #ef4444; flex-shrink: 0; }
        [data-composition-id="crossed-out"] .card { position: absolute; left: 108px; width: 864px; height: 170px; border-radius: 32px; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.14); }
        [data-composition-id="crossed-out"] .card span { position: absolute; left: 50px; right: 50px; top: 52px; height: 66px; font-size: 46px; line-height: 66px; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; }
        [data-composition-id="crossed-out"] .card svg { position: absolute; left: 0; top: 0; width: 864px; height: 170px; overflow: visible; }
        [data-composition-id="crossed-out"] .head { position: absolute; left: 100px; top: 1300px; height: 130px; font-size: 120px; line-height: 130px; font-weight: 700; letter-spacing: -0.045em; color: #c5eea8; white-space: nowrap; }
      </style>
      <div data-hf-id="hf-co01" id="crossed-out-root" data-composition-id="crossed-out" data-width="1080" data-height="1920">
        <div data-hf-id="hf-co02" class="screen" id="crossed-out-screen">
          <div data-hf-id="hf-co03" class="slats" data-layout-allow-overflow id="crossed-out-slats"></div>
          <div data-hf-id="hf-co04" class="tag" id="crossed-out-tag"><i data-hf-id="hf-co05"></i>The old way</div>
          <div data-hf-id="hf-co06" class="card" id="crossed-out-c0" style="top: 640px"><span data-hf-id="hf-co07">Discount codes everyone finds</span>
            <svg data-hf-id="hf-co08" viewBox="0 0 864 170"><line data-hf-id="hf-co09" id="crossed-out-x0a" x1="30" y1="30" x2="834" y2="140" stroke="#ef4444" stroke-width="10" stroke-linecap="round" /><line data-hf-id="hf-co10" id="crossed-out-x0b" x1="30" y1="140" x2="834" y2="30" stroke="#ef4444" stroke-width="10" stroke-linecap="round" /></svg>
          </div>
          <div data-hf-id="hf-co11" class="card" id="crossed-out-c1" style="top: 840px"><span data-hf-id="hf-co12">Upsell apps that slow you down</span>
            <svg data-hf-id="hf-co13" viewBox="0 0 864 170"><line data-hf-id="hf-co14" id="crossed-out-x1a" x1="30" y1="30" x2="834" y2="140" stroke="#ef4444" stroke-width="10" stroke-linecap="round" /><line data-hf-id="hf-co15" id="crossed-out-x1b" x1="30" y1="140" x2="834" y2="30" stroke="#ef4444" stroke-width="10" stroke-linecap="round" /></svg>
          </div>
          <div data-hf-id="hf-co16" class="card" id="crossed-out-c2" style="top: 1040px"><span data-hf-id="hf-co17">Hours of theme code</span>
            <svg data-hf-id="hf-co18" viewBox="0 0 864 170"><line data-hf-id="hf-co19" id="crossed-out-x2a" x1="30" y1="30" x2="834" y2="140" stroke="#ef4444" stroke-width="10" stroke-linecap="round" /><line data-hf-id="hf-co20" id="crossed-out-x2b" x1="30" y1="140" x2="834" y2="30" stroke="#ef4444" stroke-width="10" stroke-linecap="round" /></svg>
          </div>
          <div data-hf-id="hf-co21" class="head" id="crossed-out-head">Not anymore.</div>
        </div>
      </div>
      <script>
        (function () {
          // Emil Kowalski easing (emil-design-eng): strong ease-out for entrances, strong ease-in-out for moves. No bounce.
          (function () {
            if (window.__emilEases) return; window.__emilEases = true;
            if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("emilOut", "0.23,1,0.32,1"); CustomEase.create("emilInOut", "0.77,0,0.175,1"); }
            else { gsap.registerEase("emilOut", gsap.parseEase("expo.out")); gsap.registerEase("emilInOut", gsap.parseEase("expo.inOut")); }
          })();
          // CROSSED-OUT CARDS. Each "old way" card rises in, two red bars draw an X across it and it dims. Then the answer lands in green.
          var D = 4.5;
          var B = { tag: 0.15, cards: [0.35, 1.05, 1.75], head: 2.75 };
          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById("crossed-out-" + id); };
          tl.fromTo($("screen"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "emilOut" }, 0);
          tl.fromTo($("slats"), { x: 50 }, { x: -50, duration: D, ease: "none" }, 0);
          tl.fromTo($("tag"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "emilOut" }, B.tag);

          B.cards.forEach(function (at, i) {
            tl.fromTo($("c" + i), { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "emilOut" }, at);
            ["a", "b"].forEach(function (k, j) {
              var line = $("x" + i + k);
              var len = 820;
              tl.fromTo(line, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.22, ease: "emilOut" }, at + 0.45 + j * 0.12);
            });
            tl.to($("c" + i), { opacity: 0.4, duration: 0.4, ease: "emilOut" }, at + 0.7);
          });

          tl.fromTo($("head"), { opacity: 0, y: 36, scale: 1.08, filter: "blur(16px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "emilOut" }, B.head);
          tl.fromTo($("head"), { textShadow: "0 0 0px rgba(197,238,168,0)" }, { textShadow: "0 0 40px rgba(197,238,168,0.6)", duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, B.head + 0.4);

          tl.to($("screen"), { opacity: 0, duration: 0.35, ease: "emilOut" }, D - 0.35);
          window.__timelines["crossed-out"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
