      <script>
        (function () {
          // Emil Kowalski easing (emil-design-eng): strong ease-out for entrances, strong ease-in-out for moves. No bounce.
          (function () {
            if (window.__emilEases) return; window.__emilEases = true;
            if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("emilOut", "0.23,1,0.32,1"); CustomEase.create("emilInOut", "0.77,0,0.175,1"); }
            else { gsap.registerEase("emilOut", gsap.parseEase("expo.out")); gsap.registerEase("emilInOut", gsap.parseEase("expo.inOut")); }
          })();
          // UPSELLS FULL SCREEN. "We get your customers to buy more. That's it.": four real Upnova upsells (order volume, free gift, cross-sells, product volume) (the Upnova website's
          // phone captures) each filling the screen as a slow-turning tilted 3D layer with lens field blur (a blurred copy of the
          // screen fades in away from the focus point), hard cuts between features.
          var SHOTS = [[0, 0.95], [0.95, 1.9], [1.9, 2.8], [2.8, 3.72]];
          // each shot turns the other way so the cuts alternate
          var TURN = [[-20, -10], [18, 8], [-18, -8], [16, 6]];
          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById("upsell-wall-" + id); };
          SHOTS.forEach(function (s, i) {
            var d = s[1] - s[0];
            tl.set($("s" + i), { opacity: 1 }, s[0]);
            tl.fromTo($("p" + i), { rotationY: TURN[i][0], rotationX: 12, z: -60, y: 20 }, { rotationY: TURN[i][1], rotationX: 8, z: 40, y: 0, duration: d, ease: "none" }, s[0]);
            if (i < SHOTS.length - 1) tl.set($("s" + i), { opacity: 0 }, s[1]);
          });
          // the shots are short, so each one holds zoomed in with its feature in the middle of the screen (540, 880):
          // order volume's discount tiers, free gift's progress bar, the cross-sell row, the bundle choices.
          // FOCUS = [feature point on the unzoomed screen (y), zoom]; the phones are 1180px tall from 230px.
          var FOCUS = [[431, 1.55], [395, 1.6], [1009, 1.75], [820, 1.25]];
          FOCUS.forEach(function (f, i) {
            tl.set($("z" + i), { transformOrigin: "0px 0px", x: 540 - f[1] * 540, y: 880 - f[1] * f[0], scale: f[1] }, 0);
          });
          tl.fromTo($("s0"), { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.3, ease: "emilOut" }, 0);
          window.__timelines["upsell-wall"] = tl;
        })();
      </script>
