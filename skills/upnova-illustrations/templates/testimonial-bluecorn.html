<div data-hf-id="hf-gjdy" class="cap" id="testimonial-bluecorn-g0" data-layout-allow-overlap="">And since then,</div>

      <script>
        (function () {
          // Emil Kowalski easing (emil-design-eng): strong ease-out for entrances, strong ease-in-out for moves. No bounce.
          (function () {
            if (window.__emilEases) return; window.__emilEases = true;
            if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("emilOut", "0.23,1,0.32,1"); CustomEase.create("emilInOut", "0.77,0,0.175,1"); }
            else { gsap.registerEase("emilOut", gsap.parseEase("expo.out")); gsap.registerEase("emilInOut", gsap.parseEase("expo.inOut")); }
          })();
          // VIDEO TESTIMONIAL. Tessa, Chief Revenue Officer at Bluecorn (beeswax candles), from her video review for Upnova: two takes joined
          // with a jump cut (17.3-19.0s "And since then, yeah, it's up 10%" + 23.45-27.75s "...top line sales in our Shopify store are up 30%").
          // To reuse: swap the video and data-media-start, the name pill, GROUPS (seconds in this section) and STATS.
          var D = 6.4;
          var GROUPS = [[0.03, 0.79], [0.79, 1.7], [1.7, 2.99], [2.99, 4.06], [4.06, 4.82], [4.82, 6.0]];
          var STATS = [{ id: "0", value: 10, at: 1.34 }, { id: "1", value: 30, at: 4.9 }];
          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById("testimonial-bluecorn-" + id); };
          tl.fromTo($("screen"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "emilOut" }, 0);
          tl.fromTo($("slats"), { x: -40 }, { x: 40, duration: D, ease: "none" }, 0);
          tl.fromTo($("card"), { opacity: 0, y: 80, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "emilOut" }, 0);
          tl.fromTo($("who"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: "emilOut" }, 0.35);

          // captions: each phrase appears at once on its first word and leaves when the next one starts
          // emphasis words: a light sheen sweeps across the glass once when the phrase appears
          function sheen(el, at) {
            el.querySelectorAll(".hi").forEach(function (h) {
              tl.fromTo(h, { backgroundPosition: "130% 0, 0 0" }, { backgroundPosition: "-30% 0, 0 0", duration: 0.9, ease: "emilInOut" }, at + 0.05);
            });
          }
          GROUPS.forEach(function (g, i) {
            tl.set($("g" + i), { opacity: 1 }, g[0]);
            sheen($("g" + i), g[0]);
            tl.set($("g" + i), { opacity: 0 }, g[1]);
          });

          // the numbers rise and count on the spoken words
          STATS.forEach(function (s) {
            tl.fromTo([$("n" + s.id), $("l" + s.id)], { opacity: 0, y: 30, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "emilOut" }, s.at - 0.1);
            var c = { v: 0 };
            tl.fromTo(c, { v: 0 }, { v: s.value, duration: 0.5, ease: "emilOut",
              onUpdate: function () { $("n" + s.id).textContent = "+" + Math.round(c.v) + "%"; } }, s.at - 0.1);
            tl.fromTo($("n" + s.id), { backgroundPosition: "130% 0, 0 0" }, { backgroundPosition: "-30% 0, 0 0", duration: 1.1, ease: "emilInOut" }, s.at + 0.3);
          });

          tl.to($("screen"), { opacity: 0, duration: 0.35, ease: "emilOut" }, D - 0.4);
          window.__timelines["testimonial-bluecorn"] = tl;
        })();
      </script>
