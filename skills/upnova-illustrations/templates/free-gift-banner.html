<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <!-- needs the whole widget folder: "assets/widgets/free-gift/" (fetch-assets copies it) -->
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-SemiBold.otf"); font-weight: 600; font-style: normal; }
        [data-composition-id="free-gift-banner"] { position: absolute; inset: 0; overflow: hidden; font-family: "Inter", sans-serif; color: #fff; }
        [data-composition-id="free-gift-banner"] .screen { position: absolute; inset: 0; overflow: hidden; background: #000; }
        [data-composition-id="free-gift-banner"] .slats { position: absolute; left: -160px; width: 1400px; bottom: 0; height: 760px; background: url("assets/backgrounds/dark-slats.jpg") 50% 100% / cover no-repeat; opacity: 0.6; }
        [data-composition-id="free-gift-banner"] .tag { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; height: 84px; padding: 0 34px 0 28px; border-radius: 42px; border: 2px solid rgba(255, 255, 255, 0.32); display: flex; align-items: center; gap: 18px; font-size: 56px; font-weight: 600; letter-spacing: -0.02em; text-transform: uppercase; white-space: nowrap; }
        [data-composition-id="free-gift-banner"] .tag i { display: block; width: 18px; height: 18px; border-radius: 9px; background: #c5eea8; flex-shrink: 0; }
        /* the real widget at its phone width (398 px), shown at 2.4x; zoom keeps its text sharp */
        [data-composition-id="free-gift-banner"] .stage { position: absolute; left: 62px; top: 700px; width: 956px; }
        [data-composition-id="free-gift-banner"] .widget { width: 398px; zoom: 2.4; font-family: ui-sans-serif, system-ui, sans-serif; color: #1a1a1a; }
      </style>
      <div id="free-gift-banner-root" data-composition-id="free-gift-banner" data-width="1080" data-height="1920">
        <div class="screen" id="free-gift-banner-screen">
          <div class="slats" id="free-gift-banner-slats" data-layout-allow-overflow></div>
          <div class="tag" id="free-gift-banner-tag" style="top: 560px"><i></i>Free gift</div>
          <div class="stage" id="free-gift-banner-stage">
            <div class="widget" id="free-gift-banner-widget"></div>
          </div>
        </div>
      </div>
      <script src="assets/widgets/free-gift/free-gift-banner.js"></script>
      <script>
        (function () {
          // Emil Kowalski easing (emil-design-eng): strong ease-out for entrances, strong ease-in-out for moves. No bounce.
          (function () {
            if (window.__emilEases) return; window.__emilEases = true;
            if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("emilOut", "0.23,1,0.32,1"); CustomEase.create("emilInOut", "0.77,0,0.175,1"); }
            else { gsap.registerEase("emilOut", gsap.parseEase("expo.out")); gsap.registerEase("emilInOut", gsap.parseEase("expo.inOut")); }
          })();

          // FREE GIFT WITH PURCHASE, product page banner. This is the real Upnova component
          // (FreeGiftPdpBanner from upez/widgets, built by widgets/live/build.sh into free-gift-banner.js),
          // not a drawing of it: the video only hands it a cart total, and it draws itself.
          // Settings: the offer as merchants set it up, and the cart total at each beat.
          var OFFER = {
            tiers: [{ title: "a free gift", minPurchaseValue: 50, gifts: [
              { title: "Free gift 1", image: "assets/widgets/free-gift/photo-1.jpg" },
              { title: "Free gift 2", image: "assets/widgets/free-gift/photo-2.jpg" },
              { title: "Free gift 3", image: "assets/widgets/free-gift/photo-3.jpg" }
            ] }],
            settings: {}       // the widget's own settings: label, headline, progress_message, accent_color...
          };
          var CART = [0, 25, 42, 50];                    // $ in the cart: start, step 1, step 2, unlocked
          var B = { rise: 0.15, steps: [1.0, 2.2, 3.3], out: 6.2, end: 6.6 };

          function build() {
            var $ = function (id) { return document.getElementById("free-gift-banner-" + id); };
            var widget = window.UpnovaFreeGiftBanner.mount($("widget"), { tiers: OFFER.tiers, settings: OFFER.settings, cart: CART[0] });
            var tl = gsap.timeline({ paused: true });

            tl.fromTo($("screen"), { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0);
            tl.fromTo($("slats"), { x: -40 }, { x: 40, duration: B.end, ease: "none" }, 0);
            tl.fromTo($("tag"), { opacity: 0, y: 30, scale: 0.95, filter: "blur(10px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "emilOut" }, 0.02);
            tl.fromTo($("stage"), { opacity: 0, y: 60, scale: 0.94, filter: "blur(12px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "emilOut" }, B.rise);

            // the cart grows in steps; the widget redraws for every frame's total (bar, "$X away", unlocked)
            var cart = { v: CART[0] };
            var draw = function () { widget.setCart(Math.round(cart.v)); };
            B.steps.forEach(function (at, i) {
              tl.to(cart, { v: CART[i + 1], duration: i === 2 ? 0.5 : 0.8, ease: "emilInOut", onUpdate: draw }, at);
            });
            // the widget's own shimmer and transitions follow the video's clock
            var clock = { t: 0 };
            tl.fromTo(clock, { t: 0 }, { t: B.end, duration: B.end, ease: "none", onUpdate: function () { widget.sync(clock.t); } }, 0);

            tl.to([$("stage"), $("tag")], { opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "emilOut" }, B.out);
            window.__timelines["free-gift-banner"] = tl;
            if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
          }
          if (window.UpnovaFreeGiftBanner) build();
          else document.querySelector('script[src$="free-gift-banner.js"]').addEventListener("load", build);
        })();
      </script>
    </template>
  </body>
</html>
