<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Regular.otf"); font-weight: 400; font-style: normal; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Medium.otf"); font-weight: 500; font-style: normal; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Bold.otf"); font-weight: 700; font-style: normal; }
        [data-composition-id="checklist"] { position: absolute; inset: 0; overflow: hidden; font-family: "Inter", sans-serif; color: #151715; }
        [data-composition-id="checklist"] .screen { position: absolute; inset: 0; overflow: hidden; background: #f6f7f5; }
        [data-composition-id="checklist"] .pixels { position: absolute; left: -120px; top: -120px; width: 1320px; height: 2160px; background: url("assets/backgrounds/green-pixels.jpg") 50% 50% / cover no-repeat; }
        [data-composition-id="checklist"] .lead { position: absolute; left: 96px; top: 400px; height: 66px; font-size: 56px; line-height: 66px; font-weight: 500; letter-spacing: -0.02em; color: #1d5a2a; white-space: nowrap; }
        [data-composition-id="checklist"] .head { position: absolute; left: 90px; top: 486px; height: 130px; font-size: 124px; line-height: 130px; font-weight: 700; letter-spacing: -0.045em; text-transform: uppercase; white-space: nowrap; }
        [data-composition-id="checklist"] .card { position: absolute; left: 108px; width: 864px; top: 720px; height: 660px; border-radius: 44px; background: #ffffff; box-shadow: 0 30px 80px rgba(20, 60, 20, 0.16); }
        [data-composition-id="checklist"] .row { position: absolute; left: 56px; right: 56px; height: 120px; display: flex; align-items: center; gap: 36px; }
        [data-composition-id="checklist"] .ico { position: relative; width: 84px; height: 84px; flex-shrink: 0; }
        [data-composition-id="checklist"] .ring { position: absolute; inset: 0; border-radius: 42px; border: 6px solid #e4e7e2; }
        [data-composition-id="checklist"] .spin { position: absolute; inset: 0; border-radius: 42px; border: 6px solid transparent; border-top-color: #151715; }
        [data-composition-id="checklist"] .done { position: absolute; inset: 0; border-radius: 42px; background: #c5eea8; display: flex; align-items: center; justify-content: center; }
        [data-composition-id="checklist"] .done svg { width: 46px; height: 46px; display: block; }
        [data-composition-id="checklist"] .txt { font-size: 52px; line-height: 64px; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; }
        [data-composition-id="checklist"] .track { position: absolute; left: 56px; right: 56px; top: 560px; height: 20px; border-radius: 10px; background: #eceeea; overflow: hidden; }
        [data-composition-id="checklist"] .fill { position: absolute; inset: 0; background: #151715; transform-origin: 0% 50%; }
      </style>
      <div data-hf-id="hf-ck01" id="checklist-root" data-composition-id="checklist" data-width="1080" data-height="1920">
        <div data-hf-id="hf-ck02" class="screen" id="checklist-screen">
          <div data-hf-id="hf-ck03" class="pixels" data-layout-allow-overflow id="checklist-pixels"></div>
          <div data-hf-id="hf-ck04" class="lead" id="checklist-lead">Your offers, built by AI</div>
          <div data-hf-id="hf-ck05" class="head" id="checklist-head">3 minutes.</div>
          <div data-hf-id="hf-ck06" class="card" id="checklist-card">
            <div data-hf-id="hf-ck07" class="row" id="checklist-r0" style="top: 60px">
              <div data-hf-id="hf-ck08" class="ico"><div data-hf-id="hf-ck09" class="ring"></div><div data-hf-id="hf-ck10" class="spin" id="checklist-sp0"></div><div data-hf-id="hf-ck11" class="done" id="checklist-ok0"><svg data-hf-id="hf-ck12" viewBox="0 0 24 24" fill="none" stroke="#151715" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path data-hf-id="hf-ck13" d="M5 12.5l4.5 4.5L19 7.5" /></svg></div></div>
              <div data-hf-id="hf-ck14" class="txt">Studying your store</div>
            </div>
            <div data-hf-id="hf-ck15" class="row" id="checklist-r1" style="top: 220px">
              <div data-hf-id="hf-ck16" class="ico"><div data-hf-id="hf-ck17" class="ring"></div><div data-hf-id="hf-ck18" class="spin" id="checklist-sp1"></div><div data-hf-id="hf-ck19" class="done" id="checklist-ok1"><svg data-hf-id="hf-ck20" viewBox="0 0 24 24" fill="none" stroke="#151715" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path data-hf-id="hf-ck21" d="M5 12.5l4.5 4.5L19 7.5" /></svg></div></div>
              <div data-hf-id="hf-ck22" class="txt">Building your offers</div>
            </div>
            <div data-hf-id="hf-ck23" class="row" id="checklist-r2" style="top: 380px">
              <div data-hf-id="hf-ck24" class="ico"><div data-hf-id="hf-ck25" class="ring"></div><div data-hf-id="hf-ck26" class="spin" id="checklist-sp2"></div><div data-hf-id="hf-ck27" class="done" id="checklist-ok2"><svg data-hf-id="hf-ck28" viewBox="0 0 24 24" fill="none" stroke="#151715" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path data-hf-id="hf-ck29" d="M5 12.5l4.5 4.5L19 7.5" /></svg></div></div>
              <div data-hf-id="hf-ck30" class="txt">Ready for launch</div>
            </div>
            <div data-hf-id="hf-ck31" class="track"><div data-hf-id="hf-ck32" class="fill" id="checklist-fill"></div></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          // Emil Kowalski easing (emil-design-eng): strong ease-out for entrances, strong ease-in-out for moves. No bounce.
          (function () {
            if (window.__emilEases) return; window.__emilEases = true;
            if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("emilOut", "0.23,1,0.32,1"); CustomEase.create("emilInOut", "0.77,0,0.175,1"); }
            else { gsap.registerEase("emilOut", gsap.parseEase("expo.out")); gsap.registerEase("emilInOut", gsap.parseEase("expo.inOut")); }
          })();
          // CHECKLIST (Figma "Stage 1-3"). Each step spins, then ticks green, and the bar under the list fills one third.
          var D = 4.5;
          var B = { lead: 0.15, head: 0.3, card: 0.6, steps: [0.95, 1.75, 2.55] };
          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById("checklist-" + id); };
          tl.fromTo($("screen"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "emilOut" }, 0);
          tl.fromTo($("pixels"), { x: 40, y: -30, scale: 1.04 }, { x: -40, y: 30, scale: 1, duration: D, ease: "none" }, 0);
          tl.fromTo($("lead"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "emilOut" }, B.lead);
          tl.fromTo($("head"), { opacity: 0, y: 40, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "emilOut" }, B.head);
          tl.fromTo($("card"), { opacity: 0, y: 80, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "emilOut" }, B.card);
          tl.fromTo([$("r0"), $("r1"), $("r2")], { opacity: 0.35 }, { opacity: 0.35, duration: 0.01 }, 0);

          B.steps.forEach(function (at, i) {
            var spinStart = i === 0 ? B.card + 0.2 : B.steps[i - 1];
            tl.to($("r" + i), { opacity: 1, duration: 0.3, ease: "emilOut" }, spinStart);
            tl.fromTo($("sp" + i), { opacity: 0, rotation: 0 }, { opacity: 1, duration: 0.15 }, spinStart);
            tl.to($("sp" + i), { rotation: 360 * 2, duration: at - spinStart, ease: "none" }, spinStart);
            tl.to($("sp" + i), { opacity: 0, duration: 0.1 }, at);
            tl.fromTo($("ok" + i), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.45, ease: "emilOut" }, at);
            if (i === 0) tl.fromTo($("fill"), { scaleX: 0 }, { scaleX: 1 / 3, duration: 0.5, ease: "emilOut" }, at);
            else tl.to($("fill"), { scaleX: (i + 1) / 3, duration: 0.5, ease: "emilOut" }, at);
          });
          tl.fromTo($("fill"), { backgroundColor: "#151715" }, { backgroundColor: "#6fb43f", duration: 0.4, ease: "emilOut" }, B.steps[2] + 0.3);

          tl.to($("screen"), { opacity: 0, duration: 0.35, ease: "emilOut" }, D - 0.35);
          window.__timelines["checklist"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
