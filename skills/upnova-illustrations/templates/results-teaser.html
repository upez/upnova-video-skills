      <script>
        (function () {
          // Emil Kowalski easing (emil-design-eng): strong ease-out for entrances, strong ease-in-out for moves. No bounce.
          (function () {
            if (window.__emilEases) return; window.__emilEases = true;
            if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("emilOut", "0.23,1,0.32,1"); CustomEase.create("emilInOut", "0.77,0,0.175,1"); }
            else { gsap.registerEase("emilOut", gsap.parseEase("expo.out")); gsap.registerEase("emilInOut", gsap.parseEase("expo.inOut")); }
          })();
          // RESULTS TEASER. "you'll hear straight from the founders about what result they got": a sneak peek of 12 founder
          // video testimonials (the Upnova website's review clips) on a 3D tilted 3x3 grid, the columns scrolling in opposite
          // directions; on "about what result they got" the grid dims and three real results rise in with each brand's logo.
          var D = 4.15, R = 2.18;
          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById("results-teaser-" + id); };
          function rise(el, at, d) { tl.fromTo(el, { opacity: 0, y: 30, scale: 0.95, filter: "blur(10px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: d || 0.6, ease: "emilOut" }, at); }
          function sheen(el, at) { tl.fromTo(el, { backgroundPosition: "130% 0, 0 0" }, { backgroundPosition: "-30% 0, 0 0", duration: 0.9, ease: "emilInOut" }, at); }
          tl.fromTo($("screen"), { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0);
          // the tilted grid: lands from slightly flatter, then holds its tilt while the columns scroll
          tl.fromTo($("grid"), { opacity: 0, rotationX: 14, rotationZ: -6, scale: 1.08 }, { opacity: 1, rotationX: 26, rotationZ: -12, scale: 1, duration: 1.1, ease: "emilOut" }, 0);
          tl.fromTo([$("col0"), $("col2")], { y: -520 }, { y: 0, duration: D, ease: "none" }, 0);
          tl.fromTo($("col1"), { y: 0 }, { y: -520, duration: D, ease: "none" }, 0);
          // results over the dimmed grid
          tl.fromTo($("dim"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "emilOut" }, R - 0.1);
          rise($("tag"), R + 0.02, 0.5);
          [0, 1, 2].forEach(function (i) { rise($("r" + i), R + 0.15 + i * 0.22, 0.7); sheen($("n" + i), R + 0.3 + i * 0.22); });
          window.__timelines["results-teaser"] = tl;
        })();
