        (function () {
          // Emil Kowalski easing (emil-design-eng): strong ease-out for entrances, strong ease-in-out for moves. No bounce.
          (function () {
            if (window.__emilEases) return; window.__emilEases = true;
            if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("emilOut", "0.23,1,0.32,1"); CustomEase.create("emilInOut", "0.77,0,0.175,1"); }
            else { gsap.registerEase("emilOut", gsap.parseEase("expo.out")); gsap.registerEase("emilInOut", gsap.parseEase("expo.inOut")); }
          })();
          // STEP 1, YOUR DATA. A store analytics report on paper (conversion rate, AOV, revenue, best sellers, sales by price
          // and by category). It lands flat, then a 3D camera tilts and glides across it, stopping on each part as it fills in:
          // "we dig into your data" (the KPIs), "you don't need to reinvent anything" (revenue), "your sales history already
          // shows what makes people spend more" (best sellers, prices, categories).
          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById("step-data-" + id); };
          var D = 6.77;
          // focus a point of the paper (paper px) at screen point (540, 680), scale S, with a tilt
          function cam(px, py, S, rx, ry) { return { x: -S * (px - 500), y: (680 - 960) - S * (py - 700), scale: S, rotationX: rx, rotationY: ry }; }
          tl.fromTo($("screen"), { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0);
          tl.fromTo($("slats"), { x: -40 }, { x: 40, duration: D, ease: "none" }, 0);
          tl.fromTo($("t0"), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "emilOut" }, 0);
          tl.to($("t0"), { opacity: 0, duration: 0.2, ease: "emilOut" }, 3.55);
          tl.fromTo($("t1"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "emilOut" }, 3.72);
          // 1 flat: the whole report rises in
          tl.fromTo($("paper"), { opacity: 0, x: 0, y: 70, scale: 0.94, rotationX: 0, rotationY: 0 }, { opacity: 1, x: 0, y: 0, scale: 0.94, rotationX: 0, rotationY: 0, duration: 0.7, ease: "emilOut" }, 0.02);
          tl.fromTo($("band"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "emilOut" }, 0.6);
          // 2 the camera tilts in on conversion rate and AOV
          tl.to($("paper"), Object.assign(cam(498, 300, 1.08, 12, -4), { duration: 1.0, ease: "emilInOut" }), 0.75);
          tl.to($("paper"), Object.assign(cam(498, 300, 1.12, 10, -2), { duration: 0.9, ease: "none" }), 1.75);
          // 3 glide to the revenue chart while the line draws
          tl.to($("paper"), Object.assign(cam(520, 590, 1.55, 16, 14), { duration: 0.95, ease: "emilInOut" }), 2.65);
          var line = $("line"), len = 1200;
          tl.fromTo(line, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.1, ease: "emilInOut" }, 2.75);
          tl.fromTo($("area"), { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "emilOut" }, 3.2);
          // 4 best sellers, the bars grow
          tl.to($("paper"), Object.assign(cam(290, 900, 1.9, 12, -16), { duration: 0.9, ease: "emilInOut" }), 3.7);
          [0, 1, 2, 3, 4].forEach(function (i) { tl.fromTo($("bb" + i), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "emilOut" }, 3.95 + i * 0.07); });
          // 5 sales by price, the columns rise
          tl.to($("paper"), Object.assign(cam(740, 920, 1.9, 12, 16), { duration: 0.85, ease: "emilInOut" }), 4.75);
          [0, 1, 2, 3, 4].forEach(function (i) { tl.fromTo($("pc" + i), { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "emilOut" }, 4.95 + i * 0.06); });
          // 6 sales by category, the donut fills
