<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Regular.otf"); font-weight: 400; font-style: normal; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Medium.otf"); font-weight: 500; font-style: normal; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Bold.otf"); font-weight: 700; font-style: normal; }
        [data-composition-id="before-after"] { position: absolute; inset: 0; overflow: hidden; font-family: "Inter", sans-serif; }
        [data-composition-id="before-after"] .screen { position: absolute; inset: 0; overflow: hidden; background: #000; }
        [data-composition-id="before-after"] .half { position: absolute; left: 0; width: 1080px; height: 960px; overflow: hidden; }
        [data-composition-id="before-after"] .top { top: 0; background: #000; color: #fff; }
        [data-composition-id="before-after"] .bot { top: 960px; background: #f6f7f5; color: #151715; }
        [data-composition-id="before-after"] .slats { position: absolute; left: -160px; width: 1400px; bottom: 0; height: 560px; background: url("assets/backgrounds/dark-slats.jpg") 50% 100% / cover no-repeat; opacity: 0.55; }
        [data-composition-id="before-after"] .pixels { position: absolute; left: -120px; top: -120px; width: 1320px; height: 1200px; background: url("assets/backgrounds/green-pixels.jpg") 50% 50% / cover no-repeat; }
        [data-composition-id="before-after"] .lab { position: absolute; left: 108px; height: 66px; font-size: 56px; line-height: 66px; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; }
        [data-composition-id="before-after"] .val { position: absolute; left: 96px; height: 230px; font-size: 220px; line-height: 230px; font-weight: 700; letter-spacing: -0.05em; white-space: nowrap; }
        [data-composition-id="before-after"] .cap { position: absolute; left: 108px; height: 50px; font-size: 40px; line-height: 50px; font-weight: 400; white-space: nowrap; }
        [data-composition-id="before-after"] svg { position: absolute; left: 540px; width: 440px; height: 260px; overflow: visible; }
        [data-composition-id="before-after"] .divider { position: absolute; left: 0; top: 958px; width: 1080px; height: 4px; background: #c5eea8; transform-origin: 0% 50%; }
        [data-composition-id="before-after"] .chip { position: absolute; left: 700px; top: 910px; width: 280px; height: 100px; border-radius: 50px; background: #c5eea8; color: #0b0d0a; text-align: center; font-size: 60px; line-height: 100px; font-weight: 700; letter-spacing: -0.03em; white-space: nowrap; }
      </style>
      <div data-hf-id="hf-ba01" id="before-after-root" data-composition-id="before-after" data-width="1080" data-height="1920">
        <div data-hf-id="hf-ba02" class="screen" id="before-after-screen">
          <div data-hf-id="hf-ba03" class="half top" id="before-after-top">
            <div data-hf-id="hf-ba04" class="slats" data-layout-allow-overflow id="before-after-slats"></div>
            <div data-hf-id="hf-ba05" class="lab" id="before-after-l0" style="top: 330px; color: rgba(255, 255, 255, 0.6)">Without Upnova</div>
            <div data-hf-id="hf-ba06" class="val" id="before-after-v0" style="top: 420px; color: rgba(255, 255, 255, 0.85)">$0</div>
            <div data-hf-id="hf-ba07" class="cap" id="before-after-c0" style="top: 660px; color: rgba(255, 255, 255, 0.5)">average order</div>
            <svg data-hf-id="hf-ba08" viewBox="0 0 440 260" style="top: 470px">
              <path data-hf-id="hf-ba09" id="before-after-p0" d="M 10 170 C 80 150, 120 190, 190 170 S 300 150, 360 175 S 420 165, 430 172" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="10" stroke-linecap="round" />
            </svg>
          </div>
          <div data-hf-id="hf-ba10" class="half bot" id="before-after-bot">
            <div data-hf-id="hf-ba11" class="pixels" data-layout-allow-overflow id="before-after-pixels"></div>
            <div data-hf-id="hf-ba12" class="lab" id="before-after-l1" style="top: 150px; color: #151715">With Upnova</div>
            <div data-hf-id="hf-ba13" class="val" id="before-after-v1" style="top: 240px">$0</div>
            <div data-hf-id="hf-ba14" class="cap" id="before-after-c1" style="top: 480px; color: rgba(21, 23, 21, 0.6)">average order</div>
            <svg data-hf-id="hf-ba15" viewBox="0 0 440 260" style="top: 230px">
              <path data-hf-id="hf-ba16" id="before-after-p1" d="M 10 240 C 120 235, 170 210, 230 150 S 340 30, 430 20" fill="none" stroke="#151715" stroke-width="12" stroke-linecap="round" />
            </svg>
          </div>
          <div data-hf-id="hf-ba17" class="divider" id="before-after-div"></div>
          <div data-hf-id="hf-ba18" class="chip" id="before-after-chip">+29%</div>
        </div>
      </div>
      <script>
        (function () {
          // Emil Kowalski easing (emil-design-eng): strong ease-out for entrances, strong ease-in-out for moves. No bounce.
          (function () {
            if (window.__emilEases) return; window.__emilEases = true;
            if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("emilOut", "0.23,1,0.32,1"); CustomEase.create("emilInOut", "0.77,0,0.175,1"); }
            else { gsap.registerEase("emilOut", gsap.parseEase("expo.out")); gsap.registerEase("emilInOut", gsap.parseEase("expo.inOut")); }
          })();
          // BEFORE / AFTER SPLIT. The dark "without" half drops in from the top, the green "with" half rises from the bottom,
          // both numbers count, the lines draw (flat vs climbing) and the gain chip lands on the seam.
          var D = 4.5;
          var BEFORE = 48, AFTER = 62, PREFIX = "$";
          var B = { halves: 0.05, before: 0.5, after: 1.3, chip: 2.4 };
          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById("before-after-" + id); };
          function count(el, to, at, dur) {
            var c = { v: 0 };
            tl.fromTo(c, { v: 0 }, { v: to, duration: dur, ease: "emilOut",
              onUpdate: function () { el.textContent = PREFIX + Math.round(c.v); } }, at);
          }
          function draw(path, at, dur) {
            var len = path.getTotalLength();
            tl.fromTo(path, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: dur, ease: "emilInOut" }, at);
          }
          tl.fromTo($("screen"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "emilOut" }, 0);
          tl.fromTo($("top"), { y: -960 }, { y: 0, duration: 0.8, ease: "emilOut" }, B.halves);
          tl.fromTo($("bot"), { y: 960 }, { y: 0, duration: 0.8, ease: "emilOut" }, B.halves + 0.08);
          tl.fromTo($("div"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "emilInOut" }, B.halves + 0.5);
          tl.fromTo($("slats"), { x: 40 }, { x: -40, duration: D, ease: "none" }, 0);
          tl.fromTo($("pixels"), { x: -30, y: 20 }, { x: 30, y: -20, duration: D, ease: "none" }, 0);

          tl.fromTo([$("l0"), $("c0")], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "emilOut" }, B.before);
          count($("v0"), BEFORE, B.before, 0.8);
          draw($("p0"), B.before + 0.1, 0.9);

          tl.fromTo([$("l1"), $("c1")], { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "emilOut" }, B.after);
          count($("v1"), AFTER, B.after, 1.0);
          draw($("p1"), B.after + 0.1, 1.0);

          tl.fromTo($("chip"), { opacity: 0, scale: 0.95, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "emilOut" }, B.chip);

          tl.to($("screen"), { opacity: 0, duration: 0.35, ease: "emilOut" }, D - 0.35);
          window.__timelines["before-after"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
