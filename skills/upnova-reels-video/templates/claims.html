      <script>
        (function () {
          // Emil Kowalski easing (emil-design-eng): strong ease-out for entrances, strong ease-in-out for moves. No bounce.
          (function () {
            if (window.__emilEases) return; window.__emilEases = true;
            if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("emilOut", "0.23,1,0.32,1"); CustomEase.create("emilInOut", "0.77,0,0.175,1"); }
            else { gsap.registerEase("emilOut", gsap.parseEase("expo.out")); gsap.registerEase("emilInOut", gsap.parseEase("expo.inOut")); }
          })();
          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById("proof-" + id); };

          // Apple-style reveal: rises out of a soft blur and settles to size.
          function rise(el, at, dur) {
            tl.fromTo(el, { opacity: 0, y: 36, scale: 1.06, filter: "blur(16px)" },
              { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: dur || 1.0, ease: "emilOut" }, at);
          }
          function fade(el, at, dur) {
            tl.to(el, { opacity: 0, y: -20, filter: "blur(10px)", duration: dur || 0.35, ease: "emilOut" }, at);
          }
          function card(id, start, end, keep) {
            var el = $(id);
            tl.set(el, { opacity: 1, visibility: "visible", y: 0 }, start);
            if (keep) return;
            tl.to(el, { opacity: 0, y: -24, duration: 0.4, ease: "emilOut" }, end - 0.4);
            tl.set(el, { opacity: 0, visibility: "hidden" }, end);
          }
          function count(el, from, to, at, dur, suffix) {
            var o = { v: from };
            tl.fromTo(o, { v: from }, {
              v: to, duration: dur, ease: "emilOut",
              onUpdate: function () { el.textContent = Math.round(o.v) + (suffix || ""); }
            }, at);
          }


          var T = function (abs) { return abs - 49.57; };
          tl.fromTo($("scrim"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "emilOut" }, 0);

          // "This can easily boost your AOV by at least 10 percent more."
          card("c1", T(49.6), T(53.06));
          rise($("c1-e"), T(49.84), 0.9);
          rise($("c1-big"), T(51.6), 0.9);
          count($("c1-big"), 0, 10, T(51.6), 0.7, "%");
          rise($("c1-s"), T(52.55), 0.6);

          // "one of many strategies that we use for 600 plus Shopify stores"

          rise($("c2-e"), T(53.3), 0.9);
          rise($("c2-big"), T(56.14), 0.9);
          count($("c2-big"), 0, 600, T(56.14), 0.9, "+");
          rise($("c2-l"), T(57.15), 0.7);
