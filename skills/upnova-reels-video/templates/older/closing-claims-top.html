      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById("end-" + id); };

          // Apple-style reveal: rises out of a soft blur and settles to size.
          function rise(el, at, dur) {
            tl.fromTo(el, { opacity: 0, y: 36, scale: 1.06, filter: "blur(16px)" },
              { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: dur || 1.0, ease: "expo.out" }, at);
          }
          function fade(el, at, dur) {
            tl.to(el, { opacity: 0, y: -20, filter: "blur(10px)", duration: dur || 0.35, ease: "power2.in" }, at);
          }
          function card(id, start, end) {
            var el = $(id);
            tl.set(el, { opacity: 1, visibility: "visible", y: 0 }, start);
            tl.to(el, { opacity: 0, y: -24, duration: 0.4, ease: "power2.in" }, end - 0.4);
            tl.set(el, { opacity: 0, visibility: "hidden" }, end);
          }

          // Scrim over the wall so the type reads, in as the shot cuts back to camera
          tl.fromTo($("scrim"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);

          // Times below are seconds from the cut back to camera (121.0s in the video).
          // 1. "I can guarantee this works, or else you don't pay."
          card("c1", 0.0, 2.86);
          rise($("c1-t"), 0.18, 1.0);
          rise($("c1-s1"), 0.8, 0.7);
          fade($("c1-s1"), 1.3, 0.2);
          rise($("c1-s2"), 1.42, 0.9);

          // 2. "All you need to do is click the link below, install Upnova, and that's it."
          card("c2", 2.89, 7.83);
          rise($("c2-e1"), 2.89, 0.8);
          fade($("c2-e1"), 3.5, 0.2);
          rise($("c2-e2"), 3.66, 0.8);
          fade($("c2-e2"), 4.55, 0.2);
          rise($("c2-e3"), 4.75, 0.8);
          rise($("c2-name"), 5.13, 1.1);
          rise($("c2-s1"), 5.8, 0.8);

          window.__timelines["claims-end"] = tl;
        })();
