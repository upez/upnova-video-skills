          // Apple-style reveal: rises out of a soft blur and settles to size.
          function rise(el, at, dur) {
            tl.fromTo(el, { opacity: 0, y: 36, scale: 1.06, filter: "blur(16px)" },

          function fade(el, at, dur) {
            tl.to(el, { opacity: 0, y: -20, filter: "blur(10px)", duration: dur || 0.35, ease: "power2.in" }, at);
          }
          function card(id, start, end) {
            var el = $(id);
            tl.set(el, { opacity: 1, visibility: "visible", y: 0 }, start);
            tl.to(el, { opacity: 0, y: -24, duration: 0.4, ease: "power2.in" }, end - 0.4);
            tl.set(el, { opacity: 0, visibility: "hidden" }, end);
          }
          function count(el, from, to, at, dur) {
            var o = { v: from };
            tl.fromTo(o, { v: from }, {
              v: to, duration: dur, ease: "power3.out",
              onUpdate: function () { el.textContent = Math.round(o.v); }
            }, at);
          }

          // Light scrim over the wall so the type reads, gone by the cut to the demo
          tl.fromTo($("scrim"), { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0);

          fade($("c1-e1"), 1.0, 0.25);
          rise($("c1-e2"), 1.12, 0.9);
          rise($("c1-from"), 2.82, 0.8);
          rise($("c1-to"), 3.08, 0.8);
          count($("c1-num"), 10, 30, 3.08, 0.75);
          rise($("c1-s1"), 3.82, 0.6);
          fade($("c1-s1"), 4.38, 0.2);
          rise($("c1-s2"), 4.5, 0.9);

          // 2. "I'm serious."

          tl.fromTo($("c2-t"), { opacity: 0, scale: 1.12, filter: "blur(18px)" },
