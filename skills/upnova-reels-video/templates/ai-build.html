        (function () {
          // Emil Kowalski easing (emil-design-eng): strong ease-out for entrances, strong ease-in-out for moves. No bounce.
          (function () {
            if (window.__emilEases) return; window.__emilEases = true;
            if (window.CustomEase) { gsap.registerPlugin(CustomEase); CustomEase.create("emilOut", "0.23,1,0.32,1"); CustomEase.create("emilInOut", "0.77,0,0.175,1"); }

          })();
          var tl = gsap.timeline({ paused: true });
          var $ = function (id) { return document.getElementById("ai-build-" + id); };
          // Spoken times in the full video, turned into this section's local time (it starts at 60.21s).
          var T = function (abs) { return abs - 60.21; };
          function rise(el, at, dur) {
            tl.fromTo(el, { opacity: 0, y: 36, scale: 1.04, filter: "blur(14px)" },
              { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: dur || 0.9, ease: "emilOut" }, at);
          }

          // Screen opens as a circle from the middle, over the camera shot ("Upnova")
          tl.fromTo($("screen"), { clipPath: "circle(0% at 50% 50%)" },
            { clipPath: "circle(75% at 50% 50%)", duration: 0.6, ease: "emilInOut" }, 0);

          // Logo rises in out of a blur
          tl.fromTo($("word"), { opacity: 0, y: 30, scale: 0.9, filter: "blur(14px)" },
            { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "emilOut" }, 0.25);

          // "which is now powered by AI"
          rise($("tag"), T(61.1), 0.8);

            { textShadow: "0 0 24px rgba(197,238,168,0.7)", duration: 0.5, ease: "emilOut" }, T(62.22));

          // Prompt bar arrives, then types along with "build your entire upsell system"
          rise($("prompt"), T(61.85), 0.8);
          tl.fromTo($("spark"), { rotation: 0 }, { rotation: 360, duration: 0.6, ease: "emilInOut" }, T(62.2));
          tl.fromTo($("caret"), { opacity: 1 }, { opacity: 0.15, duration: 0.25, ease: "steps(1)", yoyo: true, repeat: 11 }, T(61.9));
          tl.set($("ph"), { display: "none" }, T(62.64));
          var msg = "Build my entire upsell system";
          var typed = { n: 0 };
          tl.fromTo(typed, { n: 0 }, {
            n: msg.length, duration: 1.85, ease: "none",
            onUpdate: function () { $("text").textContent = msg.slice(0, Math.round(typed.n)); }
          }, T(62.66));

          // Send is pressed, the line runs down and five empty slots appear
          tl.fromTo($("send"), { scale: 1 }, { scale: 0.97, duration: 0.08, ease: "emilOut" }, T(64.66));
          tl.to($("send"), { scale: 1, duration: 0.16, ease: "emilOut" }, T(64.74));

            tl.fromTo($("o" + j + "-real"), { opacity: 0, x: -24, filter: "blur(10px)" },

            tl.fromTo($("o" + j + "-lit"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "emilOut" }, at);

            tl.fromTo($("o" + j + "-live"), { opacity: 0, scale: 0.95 },

          tl.fromTo($("sweep"), { y: 560, opacity: 0 }, { y: 1300, opacity: 1, duration: 0.55, ease: "emilInOut" }, T(65.08));
